# NotePulse 一键部署
# 用法: docker-compose up -d --build
# 停止: docker-compose down
# 查看日志: docker-compose logs -f backend

services:
  # ====== MySQL 数据库 ======
  mysql:
    image: mysql:8.4
    container_name: notepulse-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-zbdxwf5201314}
      MYSQL_DATABASE: maiji
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-zbdxwf5201314}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Redis 缓存 ======
  redis:
    image: redis:8-alpine
    container_name: notepulse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ====== FastAPI 后端 ======
  backend:
    build: ./NotePulse_backend
    container_name: notepulse-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-zbdxwf5201314}
      DB_NAME: maiji
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-maiji-secret-key-2026-very-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-zbdxwf5201314}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: https://api.deepseek.com/anthropic
      DEEPSEEK_MODEL: deepseek-v4-pro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  # ====== Nginx 反向代理 ======
  nginx:
    image: nginx:1.28-alpine
    container_name: notepulse-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./NotePulse_frontend:/usr/share/nginx/html/frontend
      - ./NotePulse_admin:/usr/share/nginx/html/admin
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads:
