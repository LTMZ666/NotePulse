<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脉记 · 设置</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { background: var(--bg-0); }
        .pulse-bg, .pulse-bg::before, .pulse-bg::after { display: none; }
        .page-main { max-width: 1100px; margin: 0 auto; padding: 120px 56px 100px; }
        .page-hero { padding: 48px 52px; margin-bottom: 40px; }
        .page-hero h1 { font-family: var(--font-brush); font-size: 34px; color: var(--indigo); letter-spacing: 4px; margin-bottom: 10px; }
        .page-hero p { color: var(--text-dim); font-family: var(--font-kai); font-size: 14px; }
        .page-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-seal { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: var(--grad-cinnabar); color: var(--paper-0); font-family: var(--font-brush); font-size: 18px; border-radius: 4px; box-shadow: var(--shadow-seal); }
        .logo-text { font-family: var(--font-brush); font-size: 22px; color: var(--ink-10); letter-spacing: 4px; }
        .back-link { margin-left: auto; padding: 6px 14px; border: 1px solid var(--border-gold); border-radius: 4px; color: var(--ochre); text-decoration: none; font-family: var(--font-kai); font-size: 13px; transition: all .2s; }
        .back-link:hover { background: var(--grad-gold); color: var(--paper-0); }
        .page-nav .user-menu { margin-left: 16px; }
        .ud-list a.active { color: var(--cinnabar); font-weight: 600; }
        .settings-layout { gap: 36px; }
        .panel-card { padding: 40px 48px; }
        .settings-form { gap: 24px; margin-top: 20px; }
        .form-field { gap: 10px; margin-bottom: 8px; }
        .field-label { margin-bottom: 4px; }
        .input-wrap input, .textarea-wrap textarea { padding: 12px 16px; }
        .settings-section { gap: 20px; margin-top: 20px; }
        .pref-row { padding: 20px 22px; }

        /* —— 头像上传组件 —— */
        .avatar-upload {
            display: flex; align-items: center; gap: 20px;
            padding: 16px;
            background: rgba(255, 251, 238, 0.5);
            border: 1px solid var(--border-gold);
            border-radius: 4px;
        }
        .avatar-preview {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6b1a4a 0%, #3a0f28 55%, #15060f 100%);
            border: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            color: #e8c46a; font-family: var(--font-brush); font-size: 28px;
            overflow: hidden; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(107, 26, 74, 0.3);
        }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .avatar-actions { display: flex; flex-direction: column; gap: 8px; }
        .avatar-file-btn {
            display: inline-block;
            padding: 8px 16px;
            background: var(--grad-cinnabar);
            color: var(--paper-0);
            border-radius: 4px;
            font-family: var(--font-kai);
            font-size: 13px;
            cursor: pointer;
            transition: opacity .2s;
        }
        .avatar-file-btn:hover { opacity: 0.9; }
        .avatar-file-btn input { display: none; }
        .avatar-hint { font-size: 12px; color: var(--text-mute); font-family: var(--font-kai); }
        .avatar-clear {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--text-mute);
            border-radius: 3px;
            font-family: var(--font-kai);
            font-size: 12px;
            cursor: pointer;
        }
        .avatar-clear:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
    </style>
</head>
<body>
    <header class="nav page-nav" id="simpleNav"></header>

    <main class="page-main">
        <section class="page-hero glass">
            <h1>设置 · 御之卷</h1>
            <p>主笔名册、开卷之钥、界面偏好，皆可于此调度。</p>
        </section>

        <div class="settings-layout">
            <div class="panel-card glass">
                <div class="card-head"><h3>个人资料</h3><span class="badge">主笔名册</span></div>
                <form id="profileForm" class="settings-form">
                    <div class="form-field">
                        <label class="field-label">主笔之号</label>
                        <div class="input-wrap">
                            <input type="text" id="settingsUsername" maxlength="50" placeholder="用户名"/>
                        </div>
                    </div>
                    <div class="form-field">
                        <label class="field-label">主笔之像</label>
                        <div class="avatar-upload">
                            <div class="avatar-preview" id="avatarPreview">蛊</div>
                            <div class="avatar-actions">
                                <label class="avatar-file-btn">
                                    择图上传
                                    <input type="file" id="avatarFile" accept="image/*"/>
                                </label>
                                <button type="button" class="avatar-clear" id="avatarClear">恢复蛊虫纷飞</button>
                                <span class="avatar-hint">支持 JPG/PNG，将自动转为 base64 存储</span>
                            </div>
                            <input type="hidden" id="settingsAvatar" value=""/>
                        </div>
                    </div>
                    <div class="form-field">
                        <label class="field-label">自陈小传</label>
                        <div class="textarea-wrap">
                            <textarea id="settingsBio" maxlength="500" rows="4" placeholder="简要自陈，例如：研习算学，博观群书…"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn"><span>颁行修改</span></button>
                </form>
            </div>

            <div class="panel-card glass">
                <div class="card-head"><h3>改换密钥</h3><span class="badge">开卷之钥</span></div>
                <form id="passwordForm" class="settings-form">
                    <div class="form-field">
                        <label class="field-label">新钥</label>
                        <div class="input-wrap">
                            <input type="password" id="newPassword" placeholder="至少 6 位" minlength="6"/>
                        </div>
                    </div>
                    <div class="form-field">
                        <label class="field-label">确认新钥</label>
                        <div class="input-wrap">
                            <input type="password" id="confirmPassword" placeholder="再输一次"/>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn"><span>更换密钥</span></button>
                </form>
            </div>

            <div class="panel-card glass">
                <div class="card-head"><h3>界面偏好</h3><span class="badge">仅本地</span></div>
                <div class="settings-section">
                    <div class="pref-row">
                        <div>
                            <div class="pref-name">暗夜卷帙</div>
                            <div class="pref-desc">切换为暗色古卷背景（实验性，仅本机生效）</div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="prefDarkMode"/>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="pref-row">
                        <div>
                            <div class="pref-name">笔锋字体</div>
                            <div class="pref-desc">使用毛笔楷书显示标题文字</div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="prefBrushFont"/>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span>© 2026 · 脉记 · 知识的脉搏，源远流长</span>
            <span class="footer-status"><span class="live-dot"></span>服务正常 · 运行流畅</span>
        </div>
    </footer>

    <script src="user-utils.js"></script>
    <script src="note-editor.js"></script>
    <script src="notifications.js"></script>
    <script src="settings.js"></script>
</body>
</html>
