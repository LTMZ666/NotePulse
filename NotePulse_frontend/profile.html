<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脉记 · 个人中心</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { background: var(--bg-0); }
        .pulse-bg, .pulse-bg::before, .pulse-bg::after { display: none; }
        .page-main { max-width: 1200px; margin: 0 auto; padding: 100px 24px 60px; }
        .page-hero { padding: 32px 36px; margin-bottom: 24px; }
        .page-hero h1 {
            font-family: var(--font-brush);
            font-size: 32px;
            color: var(--indigo);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .page-hero p {
            color: var(--text-dim);
            font-family: var(--font-kai);
            font-size: 14px;
        }
        .page-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-seal {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px;
            background: var(--grad-cinnabar);
            color: var(--paper-0);
            font-family: var(--font-brush);
            font-size: 18px;
            border-radius: 4px;
            box-shadow: var(--shadow-seal);
        }
        .logo-text {
            font-family: var(--font-brush);
            font-size: 22px;
            color: var(--ink-10);
            letter-spacing: 4px;
        }
        .back-link {
            margin-left: auto;
            padding: 6px 14px;
            border: 1px solid var(--border-gold);
            border-radius: 4px;
            color: var(--ochre);
            text-decoration: none;
            font-family: var(--font-kai);
            font-size: 13px;
            transition: all .2s;
        }
        .back-link:hover { background: var(--grad-gold); color: var(--paper-0); }
        .page-nav .user-menu { margin-left: 16px; }
        .ud-list a.active { color: var(--cinnabar); font-weight: 600; }
    </style>
</head>
<body>
    <header class="nav page-nav" id="simpleNav"></header>

    <main class="page-main">
        <section class="page-hero glass">
            <h1>个人中心 · 主笔卷</h1>
            <p>同道之号，于此一览；入卷时日，俱已载明。</p>
        </section>

        <!-- 用户英雄卡 -->
        <div class="profile-hero glass">
            <div class="profile-avatar-large" id="profileAvatar">
                <span>蛊</span>
            </div>
            <div class="profile-meta">
                <h2 class="profile-name" id="profileName">同道</h2>
                <p class="profile-email" id="profileEmail">—</p>
                <p class="profile-bio" id="profileBio">尚无简介，请于设置面板补全</p>
                <div class="profile-joined">
                    <span class="profile-joined-label">入卷于</span>
                    <span id="profileJoined">—</span>
                </div>
            </div>
        </div>

        <!-- 统计三卡 -->
        <div class="profile-stats-row">
            <div class="metric-card glass">
                <div class="metric-label">典藏笔记</div>
                <div class="metric-value" id="profileNoteCount">0</div>
            </div>
            <div class="metric-card glass">
                <div class="metric-label">已入藏帖</div>
                <div class="metric-value" id="profilePostCount">0</div>
            </div>
            <div class="metric-card glass">
                <div class="metric-label">珍帖收藏</div>
                <div class="metric-value" id="profileFavCount">0</div>
            </div>
        </div>

        <!-- 近墨留痕 -->
        <div class="panel-card glass">
            <div class="card-head">
                <h3>近墨留痕</h3>
                <span class="badge">最近活动</span>
            </div>
            <div class="profile-feed" id="profileFeed">
                <div class="profile-empty">载入中…</div>
            </div>
        </div>

        <!-- 我的帖子 -->
        <div class="panel-card glass" style="margin-top:24px;">
            <div class="card-head">
                <h3>我的帖子 · 帖之卷</h3>
                <span class="badge" id="profilePostCount2">0 帖</span>
                <button class="back-link" id="profileNewPostBtn" style="margin-left:auto;">
                    <span class="note-btn-seal" style="background:var(--grad-gold);">帖</span> 落笔成帖
                </button>
            </div>
            <div class="posts-grid" id="profilePostsGrid">
                <div class="profile-empty">展卷载入…</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span>© 2026 · 脉记 · 知识的脉搏，源远流长</span>
            <span class="footer-status"><span class="live-dot"></span>服务正常 · 运行流畅</span>
        </div>
    </footer>

    <script src="user-utils.js"></script>
    <script src="note-editor.js"></script>
    <script src="post-editor.js"></script>
    <script src="notifications.js"></script>
    <script src="profile.js"></script>
</body>
</html>
