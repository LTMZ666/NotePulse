<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脉记 · 我的收藏</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { background: var(--bg-0); }
        .pulse-bg, .pulse-bg::before, .pulse-bg::after { display: none; }
        .page-main { max-width: 1200px; margin: 0 auto; padding: 100px 24px 60px; }
        .page-hero { padding: 32px 36px; margin-bottom: 24px; }
        .page-hero h1 { font-family: var(--font-brush); font-size: 32px; color: var(--indigo); letter-spacing: 4px; margin-bottom: 8px; }
        .page-hero p { color: var(--text-dim); font-family: var(--font-kai); font-size: 14px; }
        .page-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-seal { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: var(--grad-cinnabar); color: var(--paper-0); font-family: var(--font-brush); font-size: 18px; border-radius: 4px; box-shadow: var(--shadow-seal); }
        .logo-text { font-family: var(--font-brush); font-size: 22px; color: var(--ink-10); letter-spacing: 4px; }
        .back-link { margin-left: auto; padding: 6px 14px; border: 1px solid var(--border-gold); border-radius: 4px; color: var(--ochre); text-decoration: none; font-family: var(--font-kai); font-size: 13px; transition: all .2s; }
        .back-link:hover { background: var(--grad-gold); color: var(--paper-0); }
        .page-nav .user-menu { margin-left: 16px; }
        .ud-list a.active { color: var(--cinnabar); font-weight: 600; }
    </style>
</head>
<body>
    <header class="nav page-nav" id="simpleNav"></header>

    <main class="page-main">
        <section class="page-hero glass">
            <h1>我的收藏 · 珍之卷</h1>
            <p>同道藏帖之珍，于此陈列；可入可出，皆随心意。</p>
        </section>

        <div class="panel-card glass" style="padding:16px 24px;margin-bottom:20px;">
            <div class="card-head" style="margin-bottom:0;">
                <h3>珍帖收藏 · 我的藏珍</h3>
                <span class="badge" id="favCount">0 帖</span>
            </div>
        </div>

        <div class="posts-grid" id="favoritesGrid">
            <div class="profile-empty">载入中…</div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span>© 2026 · 脉记 · 知识的脉搏，源远流长</span>
            <span class="footer-status"><span class="live-dot"></span>服务正常 · 运行流畅</span>
        </div>
    </footer>

    <script src="user-utils.js"></script>
    <script src="note-editor.js"></script>
    <script src="notifications.js"></script>
    <script src="favorites.js"></script>
</body>
</html>
